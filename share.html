<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VibeCraft — Shared Music Page</title>
    <meta name="description" content="Listen to a music page created with VibeCraft">
    <link rel="stylesheet" href="/index.css">
    <style>
        .share-page { min-height: 100vh; display: flex; flex-direction: column; }
        .share-header { 
            background: rgba(0,0,0,0.7); 
            padding: 1.5rem; 
            text-align: center; 
            border-bottom: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
        }
        .share-title { font-family: 'Calistoga', cursive; font-size: 1.75rem; color: white; margin: 0; }
        .share-desc { color: rgba(255,255,255,0.7); font-size: 0.9rem; margin: 0.5rem 0 0; }
        .share-body { flex: 1; padding: 2rem 1rem; max-width: 600px; margin: 0 auto; width: 100%; }
        .back-to-create { 
            display: inline-block; 
            margin-bottom: 1rem; 
            padding: 0.5rem 1rem; 
            background: rgba(217, 119, 6, 0.2); 
            border: 1px solid rgba(217, 119, 6, 0.5); 
            border-radius: 0.5rem; 
            color: #d97706;
            text-decoration: none;
            font-size: 0.9rem;
        }
        .back-to-create:hover { background: rgba(217, 119, 6, 0.3); }
        .share-message {
            text-align: center;
            padding: 2rem;
            color: var(--color-muted-foreground);
        }
        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(217, 119, 6, 0.3);
            border-top-color: #d97706;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }
    </style>
</head>
<body class="grain">

<div class="share-page" id="share-page">
    <div id="share-header" class="share-header" style="display: none;">
        <h1 class="share-title" id="share-title">My Music Page</h1>
        <p class="share-desc" id="share-desc">Created with VibeCraft</p>
    </div>

    <div class="share-body">
        <a href="/" class="back-to-create">← Create Your Own Music Page</a>
        
        <div id="share-content" class="share-message">
            <div class="loading-spinner"></div>
            <p>Loading your music page...</p>
        </div>

        <!-- Music Player (will be inserted here) -->
        <div id="music-player" class="music-player player-hidden" style="position: relative; bottom: auto; margin-top: 2rem;">
            <div class="player-progress" id="player-progress-bar">
                <div class="progress-fill" id="progress-fill"></div>
                <div class="progress-thumb" id="progress-thumb"></div>
            </div>
            <div class="player-content">
                <div class="now-playing">
                    <div class="now-playing-thumb" id="now-playing-thumb">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="opacity:0.3"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
                    </div>
                    <div class="now-playing-info">
                        <p class="now-playing-title" id="now-playing-title">No track playing</p>
                        <p class="now-playing-artist" id="now-playing-artist">—</p>
                    </div>
                </div>

                <div class="player-controls">
                    <button class="control-btn" id="shuffle-btn" title="Shuffle">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 18h1.4c1.3 0 2.5-.6 3.3-1.7l6.1-8.6c.7-1.1 2-1.7 3.3-1.7H22"/><path d="m18 2 4 4-4 4"/><path d="M2 6h1.9c1.5 0 2.9.9 3.6 2.2"/><path d="M22 18h-5.9c-1.3 0-2.6-.7-3.3-1.8l-.5-.8"/><path d="m18 14 4 4-4 4"/></svg>
                    </button>
                    <button class="control-btn" id="prev-btn" title="Previous">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="19 20 9 12 19 4 19 20"/><line x1="5" x2="5" y1="19" y2="5"/></svg>
                    </button>
                    <button class="control-btn play-pause" id="play-pause-btn" title="Play">
                        <svg id="play-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" stroke="none"><polygon points="6 3 20 12 6 21 6 3"/></svg>
                        <svg id="pause-icon" class="hidden" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" stroke="none"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
                    </button>
                    <button class="control-btn" id="next-btn" title="Next">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" x2="19" y1="5" y2="19"/></svg>
                    </button>
                    <button class="control-btn" id="repeat-btn" title="Repeat">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/></svg>
                    </button>
                </div>

                <div class="player-right">
                    <div class="player-time">
                        <span id="current-time">0:00</span>
                        <span>/</span>
                        <span id="total-time">0:00</span>
                    </div>
                    <div class="player-volume">
                        <button class="control-btn volume-btn" id="volume-btn" title="Volume">
                            <svg id="volume-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
                            <svg id="volume-mute-icon" class="hidden" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="22" x2="16" y1="9" y2="15"/><line x1="16" x2="22" y1="9" y2="15"/></svg>
                        </button>
                        <input type="range" id="volume-slider" class="volume-slider" min="0" max="100" value="80">
                    </div>
                </div>
            </div>
        </div>

        <!-- Playlist section -->
        <div class="playlist-section playlist-card" id="share-playlist-card" style="margin-top: 2rem;">
            <div class="playlist-card-header">
                <div class="playlist-card-title">
                    <span class="section-label">Playlist</span>
                    <span id="track-count" class="track-count-badge">0 tracks</span>
                </div>
                <button id="share-playlist-toggle" class="playlist-icon-btn" type="button" title="Hide playlist" aria-expanded="true">
                    <svg class="collapse-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m18 15-6-6-6 6"/></svg>
                </button>
            </div>
            <div id="share-playlist-body" class="playlist-card-body">
                <div id="track-list" class="track-list">
                    <div id="empty-playlist" class="empty-playlist">
                        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
                        <p>No tracks</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Hidden YouTube player used by the shared playlist -->
<div id="youtube-player-container" style="position:absolute;top:-9999px;left:-9999px;width:1px;height:1px;overflow:hidden;">
    <div id="yt-player"></div>
</div>

<!-- Hidden audio element -->
<audio id="audio-element" preload="auto"></audio>

<script src="/share.js"></script>
<script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
