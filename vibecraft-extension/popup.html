<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 300px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #121212;
      color: #fff;
      margin: 0;
    }
    
    h1 {
      font-size: 16px;
      font-weight: 600;
      margin: 0 0 12px 0;
      color: #1db954;
    }
    
    .status {
      font-size: 13px;
      margin-bottom: 12px;
      padding: 8px;
      border-radius: 4px;
      background: rgba(29, 185, 84, 0.1);
      border: 1px solid rgba(29, 185, 84, 0.3);
    }
    
    .status.error {
      background: rgba(255, 0, 0, 0.1);
      border-color: rgba(255, 0, 0, 0.3);
      color: #ff6b6b;
    }
    
    .song-count {
      font-size: 13px;
      margin-bottom: 16px;
      color: #b3b3b3;
    }
    
    button {
      width: 100%;
      padding: 10px;
      background: #1db954;
      color: #fff;
      border: none;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    
    button:hover {
      background: #1ed760;
    }
    
    button:disabled {
      background: #535353;
      cursor: not-allowed;
    }
    
    .progress {
      font-size: 12px;
      margin-top: 12px;
      color: #b3b3b3;
      text-align: center;
    }
    
    .instructions {
      font-size: 11px;
      color: #b3b3b3;
      margin-top: 16px;
      padding-top: 12px;
      border-top: 1px solid #282828;
      line-height: 1.4;
    }
    
    .error-message {
      font-size: 12px;
      color: #ff6b6b;
      margin-top: 8px;
      display: none;
    }
  </style>
</head>
<body>
  <h1>🎵 VibeCraft Import</h1>
  
  <div id="status" class="status">
    Open a Spotify playlist to import
  </div>
  
  <div id="songCount" class="song-count" style="display: none;">
    0 songs detected
  </div>
  
  <button id="importBtn" disabled>
    Import to VibeCraft
  </button>
  
  <div id="progress" class="progress" style="display: none;"></div>
  
  <div id="errorMessage" class="error-message"></div>
  
  <div class="instructions">
    <strong>How to use:</strong><br>
    1. Open Spotify Web Player<br>
    2. Navigate to your playlist<br>
    3. Click "Import to VibeCraft"<br>
    4. Songs will be added to VibeCraft
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
